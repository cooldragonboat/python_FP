{% extends "base.html" %}
{% block title %}註冊 - MoodTrack{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<form class="card auth" method="post">
  <h2>MoodTrack 註冊</h2>
  <label>使用者名稱
    <input type="text" id="username" name="username" minlength="3" maxlength="30" required
           value="{{ request.form.get('username', '') }}" autocomplete="username">
  </label>
  <label>電子郵件
    <input type="email" id="email" name="email" maxlength="120" required
           value="{{ request.form.get('email', '') }}" autocomplete="email">
  </label>
  <label>密碼（至少 6 個字元）
    <input type="password" id="password" name="password" minlength="6" required autocomplete="new-password">
  </label>
  <label>再輸入一次密碼
    <input type="password" id="confirm" name="confirm" minlength="6" required autocomplete="new-password">
  </label>
  <button type="submit" class="button">註冊</button>
  <p class="switch">已經有帳號？<a href="{{ url_for('login') }}">前往登入</a></p>
  <p class="switch"><a href="{{ url_for('index') }}">回到首頁</a></p>
</form>
{% endblock %}
