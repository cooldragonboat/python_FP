{% extends "base.html" %}
{% block title %}登入 - MoodTrack{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<form class="card auth" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h2>MoodTrack 登入</h2>
  <label>電子郵件
    <input type="text" id="email" name="email" required placeholder="也可以輸入使用者名稱"
           value="{{ request.form.get('email', '') }}" autocomplete="username">
  </label>
  <label>密碼
    <input type="password" id="password" name="password" required autocomplete="current-password">
  </label>
  <label class="checkbox"><input type="checkbox" name="remember"> 記住我</label>
  <button type="submit" class="button">登入</button>
  <p class="switch">還沒有帳號？<a href="{{ url_for('register') }}">前往註冊</a></p>
  <p class="switch"><a href="{{ url_for('index') }}">回到首頁</a></p>
</form>
{% endblock %}
