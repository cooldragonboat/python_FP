{% extends "base.html" %}
{% block content %}
<header class="hero">
  <h1>MoodTrack</h1>
  <h2 class="tagline">個人情緒與壓力紀錄分析平台</h2>
  <p class="subtitle">記錄每天的心情、壓力、睡眠與運動狀況，協助你了解自己的生活變化。</p>
  <div class="hero-actions">
    <a class="button" href="{{ url_for('register') }}">免費註冊開始記錄</a>
    <a class="button secondary" href="{{ url_for('login') }}">我已經有帳號</a>
  </div>
</header>

<section class="features">
  <div class="card feature"><span class="emoji">😄</span><h3>心情</h3><p>1～10 分，表情跟著你的心情變。</p></div>
  <div class="card feature"><span class="emoji">🔥</span><h3>壓力</h3><p>1～10 分，追蹤壓力的起伏。</p></div>
  <div class="card feature"><span class="emoji">😴</span><h3>睡眠</h3><p>睡多久，往往決定隔天的心情。</p></div>
  <div class="card feature"><span class="emoji">🏃</span><h3>運動</h3><p>動一動，看看對情緒有沒有幫助。</p></div>
</section>
{% endblock %}
