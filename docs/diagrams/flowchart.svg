<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1700" width="1600" height="1700"
     font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC','WenQuanYi Zen Hei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6d28d9" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #312e81; }
      .sub { font-size: 15px; fill: #64748b; }
      .sec { fill: #fbfaff; stroke: #ede9fe; stroke-width: 1.5; }
      .sec-n { fill: #7c3aed; }
      .sec-nt { font-size: 15px; font-weight: 700; fill: #fff; }
      .sec-t { font-size: 19px; font-weight: 700; fill: #4c1d95; }
      .term { fill: #7c3aed; }
      .term-t { font-size: 15.5px; font-weight: 700; fill: #ffffff; }
      .back { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; }
      .back-t { font-size: 15px; font-weight: 700; fill: #6d28d9; }
      .proc { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .n-h { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
      .n-t { font-size: 14px; fill: #475569; }
      .dec { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.6; }
      .dec-t { font-size: 15px; font-weight: 700; fill: #92400e; }
      .err { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5; }
      .err-t { font-size: 14px; fill: #be123c; }
      .edge { stroke: #94a3b8; stroke-width: 1.8; fill: none; stroke-linejoin: round; }
      .dot { fill: #94a3b8; }
      .pill { fill: #ffffff; stroke: #e2e8f0; }
      .pill.yes { fill: #ecfdf5; stroke: #a7f3d0; }
      .pill.no { fill: #fff1f2; stroke: #fecdd3; }
      .lbl { font-size: 13.5px; fill: #475569; }
      .lbl.yes { fill: #047857; font-weight: 700; }
      .lbl.no { fill: #be123c; font-weight: 700; }
      .note { fill: #ffffff; stroke: #ddd6fe; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .note-t { font-size: 14px; fill: #475569; }
      .leg { font-size: 14px; fill: #475569; }
    </style>
  </defs>
  <rect width="1600" height="1700" fill="#ffffff"/>
  <text x="40" y="56" class="title">MoodTrack 系統流程圖</text>
  <text x="40" y="84" class="sub">使用者從開啟網站、註冊登入，到記錄、查詢、分析與登出的完整流程</text>
  <rect x="30" y="100" width="1540" height="760" rx="20" class="sec"/><circle cx="64" cy="134" r="15" class="sec-n"/><text x="64" y="140" text-anchor="middle" class="sec-nt">1</text><text x="88" y="141" class="sec-t">帳號：註冊與登入</text><rect x="30" y="884" width="1540" height="720" rx="20" class="sec"/><circle cx="64" cy="918" r="15" class="sec-n"/><text x="64" y="924" text-anchor="middle" class="sec-nt">2</text><text x="88" y="925" class="sec-t">登入後：每日紀錄、歷史紀錄、資料分析</text><rect x="695.0" y="135.0" width="210" height="50" rx="25.0" class="term" filter="url(#sh)"/><text x="800" y="165.0" text-anchor="middle" class="term-t">開始：開啟 MoodTrack</text><rect x="675.0" y="221.0" width="250" height="48" rx="12" class="proc" filter="url(#sh)"/><text x="800" y="250.0" text-anchor="middle" class="n-h">首頁</text><path d="M800,305.0 L895.0,355 L800,405.0 L705.0,355 Z" class="dec" filter="url(#sh)"/><text x="800" y="360.0" text-anchor="middle" class="dec-t">已登入？</text><path d="M800,440.0 L895.0,490 L800,540.0 L705.0,490 Z" class="dec" filter="url(#sh)"/><text x="800" y="495.0" text-anchor="middle" class="dec-t">已有帳號？</text><rect x="275.0" y="453.0" width="270" height="74" rx="12" class="proc" filter="url(#sh)"/><text x="410" y="485" text-anchor="middle" class="n-h">註冊頁</text><text x="410" y="505" text-anchor="middle" class="n-t">填寫使用者名稱、Email、密碼</text><path d="M410,575.0 L505.0,625 L410,675.0 L315.0,625 Z" class="dec" filter="url(#sh)"/><text x="410" y="630.0" text-anchor="middle" class="dec-t">資料正確？</text><rect x="75.0" y="588.0" width="170" height="74" rx="12" class="err" filter="url(#sh)"/><text x="160" y="620.0" text-anchor="middle" class="err-t">顯示錯誤訊息</text><text x="160" y="640.0" text-anchor="middle" class="err-t">保留已填資料</text><rect x="275.0" y="723.0" width="270" height="74" rx="12" class="proc" filter="url(#sh)"/><text x="410" y="755" text-anchor="middle" class="n-h">密碼雜湊（scrypt）</text><text x="410" y="775" text-anchor="middle" class="n-t">存入 users 資料表</text><rect x="665.0" y="588.0" width="270" height="74" rx="12" class="proc" filter="url(#sh)"/><text x="800" y="620" text-anchor="middle" class="n-h">登入頁</text><text x="800" y="640" text-anchor="middle" class="n-t">輸入 Email（或名稱）與密碼</text><path d="M800,710.0 L895.0,760 L800,810.0 L705.0,760 Z" class="dec" filter="url(#sh)"/><text x="800" y="765.0" text-anchor="middle" class="dec-t">帳密正確？</text><rect x="1050.0" y="723.0" width="200" height="74" rx="12" class="err" filter="url(#sh)"/><text x="1150" y="755.0" text-anchor="middle" class="err-t">顯示「電子郵件</text><text x="1150" y="775.0" text-anchor="middle" class="err-t">或密碼錯誤」</text><path d="M800,185 L800,221" class="edge" marker-end="url(#arr)"/><path d="M800,269 L800,305" class="edge" marker-end="url(#arr)"/><path d="M800,405 L800,440" class="edge" marker-end="url(#arr)"/><rect x="807" y="412" width="28" height="23" rx="11.5" class="pill no"/><text x="814" y="428" text-anchor="start" class="lbl no">否</text><path d="M895,355 L1480,355 L1480,960 L972,960" class="edge" marker-end="url(#arr)"/><rect x="936.0" y="333" width="28" height="23" rx="11.5" class="pill yes"/><text x="950" y="349" text-anchor="middle" class="lbl yes">是</text><path d="M705,490 L545,490" class="edge" marker-end="url(#arr)"/><rect x="646.0" y="468" width="28" height="23" rx="11.5" class="pill no"/><text x="660" y="484" text-anchor="middle" class="lbl no">否</text><path d="M800,540 L800,587" class="edge" marker-end="url(#arr)"/><rect x="807" y="553" width="28" height="23" rx="11.5" class="pill yes"/><text x="814" y="569" text-anchor="start" class="lbl yes">是</text><path d="M410,527 L410,575" class="edge" marker-end="url(#arr)"/><path d="M315,625 L245,625" class="edge" marker-end="url(#arr)"/><rect x="264.0" y="603" width="28" height="23" rx="11.5" class="pill no"/><text x="278" y="619" text-anchor="middle" class="lbl no">否</text><path d="M160,594 L160,490 L275,490" class="edge" marker-end="url(#arr)"/><path d="M410,675 L410,723" class="edge" marker-end="url(#arr)"/><rect x="417" y="688" width="28" height="23" rx="11.5" class="pill yes"/><text x="424" y="704" text-anchor="start" class="lbl yes">是</text><path d="M545,760 L605,760 L605,625 L665,625" class="edge" marker-end="url(#arr)"/><rect x="606" y="683" width="84" height="23" rx="11.5" class="pill "/><text x="613" y="699" text-anchor="start" class="lbl ">導向登入頁</text><path d="M800,662 L800,710" class="edge" marker-end="url(#arr)"/><path d="M895,760 L1050,760" class="edge" marker-end="url(#arr)"/><rect x="921.0" y="738" width="28" height="23" rx="11.5" class="pill no"/><text x="935" y="754" text-anchor="middle" class="lbl no">否</text><path d="M1150,727 L1150,625 L935,625" class="edge" marker-end="url(#arr)"/><path d="M800,810 L800,922" class="edge" marker-end="url(#arr)"/><rect x="807" y="830" width="126" height="23" rx="11.5" class="pill yes"/><text x="814" y="846" text-anchor="start" class="lbl yes">是：建立登入狀態</text><rect x="630.0" y="923.0" width="340" height="74" rx="12" class="proc" filter="url(#sh)"/><text x="800" y="955" text-anchor="middle" class="n-h">儀表板</text><text x="800" y="975" text-anchor="middle" class="n-t">統計卡片・心情日曆・趨勢圖・小發現</text><path d="M800,1033.0 L890.0,1075 L800,1117.0 L710.0,1075 Z" class="dec" filter="url(#sh)"/><text x="800" y="1080.0" text-anchor="middle" class="dec-t">選擇功能</text><path d="M800,997 L800,1031" class="edge" marker-end="url(#arr)"/><path d="M800,1117 V1140" class="edge"/><path d="M330,1140 H1450" class="edge"/><circle cx="800" cy="1140" r="4.5" class="dot"/><path d="M330,1140 L330,1168" class="edge" marker-end="url(#arr)"/><path d="M760,1140 L760,1168" class="edge" marker-end="url(#arr)"/><path d="M1170,1140 L1170,1168" class="edge" marker-end="url(#arr)"/><path d="M1450,1140 L1450,1168" class="edge" marker-end="url(#arr)"/><rect x="205.0" y="1163.0" width="250" height="74" rx="12" class="proc" filter="url(#sh)"/><text x="330" y="1195" text-anchor="middle" class="n-h">新增每日紀錄</text><text x="330" y="1215" text-anchor="middle" class="n-t">日期、心情、壓力、睡眠、運動</text><path d="M330,1279.0 L420.0,1325 L330,1371.0 L240.0,1325 Z" class="dec" filter="url(#sh)"/><text x="330" y="1330.0" text-anchor="middle" class="dec-t">資料正確？</text><rect x="40.0" y="1288.0" width="160" height="74" rx="12" class="err" filter="url(#sh)"/><text x="120" y="1320.0" text-anchor="middle" class="err-t">顯示錯誤</text><text x="120" y="1340.0" text-anchor="middle" class="err-t">例如分數超出範圍</text><rect x="205.0" y="1421.0" width="250" height="48" rx="12" class="proc" filter="url(#sh)"/><text x="330" y="1450.0" text-anchor="middle" class="n-h">寫入 mood_records</text><rect x="245.0" y="1513.0" width="170" height="44" rx="22.0" class="back" filter="url(#sh)"/><text x="330" y="1540.0" text-anchor="middle" class="back-t">回到儀表板</text><path d="M330,1232 L330,1279" class="edge" marker-end="url(#arr)"/><path d="M240,1325 L200,1325" class="edge" marker-end="url(#arr)"/><rect x="206.0" y="1303" width="28" height="23" rx="11.5" class="pill no"/><text x="220" y="1319" text-anchor="middle" class="lbl no">否</text><path d="M120,1294 L120,1200 L205,1200" class="edge" marker-end="url(#arr)"/><path d="M330,1371 L330,1421" class="edge" marker-end="url(#arr)"/><rect x="337" y="1386" width="28" height="23" rx="11.5" class="pill yes"/><text x="344" y="1402" text-anchor="start" class="lbl yes">是</text><path d="M330,1469 L330,1513" class="edge" marker-end="url(#arr)"/><rect x="635.0" y="1163.0" width="250" height="74" rx="12" class="proc" filter="url(#sh)"/><text x="760" y="1195" text-anchor="middle" class="n-h">歷史紀錄</text><text x="760" y="1215" text-anchor="middle" class="n-t">篩選（日期、分數）・分頁</text><rect x="635.0" y="1271.0" width="250" height="48" rx="12" class="proc" filter="url(#sh)"/><text x="760" y="1300.0" text-anchor="middle" class="n-h">選擇「編輯」或「刪除」</text><path d="M760,1349.0 L865.0,1395 L760,1441.0 L655.0,1395 Z" class="dec" filter="url(#sh)"/><text x="760" y="1400.0" text-anchor="middle" class="dec-t">是本人的紀錄？</text><rect x="890.0" y="1358.0" width="120" height="74" rx="12" class="err" filter="url(#sh)"/><text x="950" y="1390.0" text-anchor="middle" class="err-t">404</text><text x="950" y="1410.0" text-anchor="middle" class="err-t">找不到頁面</text><rect x="635.0" y="1473.0" width="250" height="94" rx="12" class="proc" filter="url(#sh)"/><text x="760" y="1505" text-anchor="middle" class="n-h">執行操作</text><text x="760" y="1525" text-anchor="middle" class="n-t">編輯：驗證後更新</text><text x="760" y="1545" text-anchor="middle" class="n-t">刪除：確認視窗後刪除</text><path d="M760,1232 L760,1271" class="edge" marker-end="url(#arr)"/><path d="M760,1319 L760,1349" class="edge" marker-end="url(#arr)"/><path d="M865,1395 L890,1395" class="edge" marker-end="url(#arr)"/><rect x="864.0" y="1350" width="28" height="23" rx="11.5" class="pill no"/><text x="878" y="1366" text-anchor="middle" class="lbl no">否</text><path d="M760,1441 L760,1473" class="edge" marker-end="url(#arr)"/><rect x="767" y="1446" width="28" height="23" rx="11.5" class="pill yes"/><text x="774" y="1462" text-anchor="start" class="lbl yes">是</text><path d="M635,1520 L580,1520 L580,1200 L635,1200" class="edge" marker-end="url(#arr)"/><rect x="581" y="1344" width="98" height="23" rx="11.5" class="pill "/><text x="588" y="1360" text-anchor="start" class="lbl ">回到歷史紀錄</text><rect x="1045.0" y="1176.0" width="250" height="48" rx="12" class="proc" filter="url(#sh)"/><text x="1170" y="1205.0" text-anchor="middle" class="n-h">資料分析</text><rect x="1050.0" y="1243.0" width="260" height="134" rx="12" class="proc" filter="url(#sh)"/><text x="1180" y="1275" text-anchor="middle" class="n-h">分析內容</text><text x="1180" y="1295" text-anchor="middle" class="n-t">平均值比較（7 天／本月／全部）</text><text x="1180" y="1315" text-anchor="middle" class="n-t">最高與最低紀錄</text><text x="1180" y="1335" text-anchor="middle" class="n-t">運動與壓力比較</text><text x="1180" y="1355" text-anchor="middle" class="n-t">睡眠 × 心情散佈圖</text><rect x="1085.0" y="1408.0" width="170" height="44" rx="22.0" class="back" filter="url(#sh)"/><text x="1170" y="1435.0" text-anchor="middle" class="back-t">回到儀表板</text><path d="M1170,1224 L1170,1245" class="edge" marker-end="url(#arr)"/><path d="M1170,1375 L1170,1408" class="edge" marker-end="url(#arr)"/><rect x="1355.0" y="1163.0" width="190" height="74" rx="12" class="proc" filter="url(#sh)"/><text x="1450" y="1195" text-anchor="middle" class="n-h">登出</text><text x="1450" y="1215" text-anchor="middle" class="n-t">清除登入狀態</text><rect x="1355.0" y="1275.0" width="190" height="50" rx="25.0" class="term" filter="url(#sh)"/><text x="1450" y="1305.0" text-anchor="middle" class="term-t">結束：回到首頁</text><path d="M1450,1232 L1450,1275" class="edge" marker-end="url(#arr)"/><rect x="1010" y="1478" width="540" height="108" rx="14" class="note"/><text x="1030" y="1510" class="note-t">🔒 儀表板、紀錄、分析頁都有 @login_required，未登入會導向登入頁</text><text x="1030" y="1538" class="note-t">🧑 所有查詢都加上 user_id = 目前登入者，只能存取自己的資料</text><text x="1030" y="1566" class="note-t">🗑️ 刪除只接受 POST，並先跳出「確定要刪除這筆紀錄嗎？」</text><rect x="40" y="1636" width="60" height="26" rx="13" class="term"/><text x="112" y="1654" class="leg">開始／結束</text><rect x="220" y="1636" width="60" height="26" rx="7" class="proc"/><text x="292" y="1654" class="leg">處理步驟</text><path d="M430,1635 L458,1649 L430,1663 L402,1649 Z" class="dec"/><text x="472" y="1654" class="leg">判斷</text><rect x="580" y="1636" width="60" height="26" rx="7" class="err"/><text x="652" y="1654" class="leg">錯誤處理</text><rect x="760" y="1636" width="60" height="26" rx="13" class="back"/><text x="832" y="1654" class="leg">返回</text>
</svg>
