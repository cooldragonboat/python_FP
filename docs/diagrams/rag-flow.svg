<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" width="1440" height="1010"
 font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC','WenQuanYi Zen Hei',sans-serif">
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#64748b"/></marker>
 <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6d28d9" flood-opacity="0.08"/></filter>
 <style>
  .title { font-size: 28px; font-weight: 700; fill: #312e81; } .sub { font-size: 15px; fill: #64748b; }
  .zone { fill: #fbfaff; stroke: #ede9fe; stroke-width: 1.5; } .zt { font-size: 18px; font-weight: 700; fill: #4c1d95; } .zs { font-size: 13.5px; fill: #64748b; }
  .proc { fill: #fff; stroke: #e2e8f0; stroke-width: 1.5; } .in { fill: #7c3aed; } .ai { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.5; }
  .ok { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; } .err { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; } .crisis { fill: #fdf4ff; stroke: #f0abfc; stroke-width: 1.5; }
  .dec { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.6; }
  .t { font-size: 15px; font-weight: 700; fill: #1e293b; } .t-s { font-size: 13px; fill: #475569; }
  .ti { font-size: 15px; font-weight: 700; fill: #fff; } .ti-s { font-size: 12.5px; fill: #ede9fe; }
  .te { font-size: 15px; font-weight: 700; fill: #9a3412; } .te-s { font-size: 13px; fill: #9a3412; }
  .tc { font-size: 14px; font-weight: 700; fill: #86198f; } .tc-s { font-size: 13px; fill: #86198f; }
  .td { font-size: 15px; font-weight: 700; fill: #92400e; } .td-s { font-size: 12px; fill: #92400e; }
  .num { fill: #312e81; } .num-t { font-size: 14px; font-weight: 700; fill: #fff; }
  .edge { stroke: #94a3b8; stroke-width: 1.8; fill: none; stroke-linejoin: round; } .dash { stroke-dasharray: 5 4; }
  .pill { fill: #fff; stroke: #e2e8f0; } .pill.yes { fill: #ecfdf5; stroke: #a7f3d0; } .pill.no { fill: #fff1f2; stroke: #fecdd3; }
  .lbl { font-size: 13px; fill: #475569; } .lbl.yes { fill: #047857; font-weight: 700; } .lbl.no { fill: #be123c; font-weight: 700; }
  .note { font-size: 13px; fill: #64748b; }
 </style>
</defs>
<rect width="1440" height="1010" fill="#fff"/>
<text x="40" y="56" class="title">MoodTrack 說明小幫手：RAG 運作流程</text>
<text x="40" y="84" class="sub">檢索增強生成（Retrieval-Augmented Generation）：先從說明文件找答案，再請語言模型整理成回答</text>
<rect x="30" y="100" width="1380" height="300" rx="18" class="zone"/><text x="50" y="130" class="zt">R 檢索（Retrieval）</text><text x="50" y="152" class="zs">rag.py：BM25 演算法，不需要向量資料庫或額外套件</text><rect x="30" y="420" width="1380" height="410" rx="18" class="zone"/><text x="50" y="450" class="zt">A + G 增強與生成（Augmented Generation）</text><text x="50" y="472" class="zs">把檢索到的段落放進提示詞，交給本機 Ollama 模型整理回答</text><rect x="45.0" y="222.0" width="170" height="76" rx="14" class="in" filter="url(#sh)"/><text x="130" y="255.0" text-anchor="middle" class="ti">使用者提問</text><text x="130" y="275.0" text-anchor="middle" class="ti-s">「怎麼補記以前的心情？」</text><circle cx="45.0" cy="222.0" r="14" class="num"/><text x="45.0" y="227.0" text-anchor="middle" class="num-t">1</text><rect x="250.0" y="212.0" width="210" height="96" rx="14" class="proc" filter="url(#sh)"/><text x="355" y="245.0" text-anchor="middle" class="t">前處理與斷詞</text><text x="355" y="265.0" text-anchor="middle" class="t-s">去除疑問詞（怎麼、嗎…）</text><text x="355" y="285.0" text-anchor="middle" class="t-s">中文相鄰兩字 bigram</text><circle cx="250.0" cy="212.0" r="14" class="num"/><text x="250.0" y="217.0" text-anchor="middle" class="num-t">2</text><rect x="495.0" y="212.0" width="220" height="96" rx="14" class="proc" filter="url(#sh)"/><text x="605" y="245.0" text-anchor="middle" class="t">BM25 檢索</text><text x="605" y="265.0" text-anchor="middle" class="t-s">知識庫 docs/help/*.md</text><text x="605" y="285.0" text-anchor="middle" class="t-s">依「## 小標題」切成 36 段</text><circle cx="495.0" cy="212.0" r="14" class="num"/><text x="495.0" y="217.0" text-anchor="middle" class="num-t">3</text><path d="M860,195.0 L965.0,260 L860,325.0 L755.0,260 Z" class="dec" filter="url(#sh)"/><text x="860" y="247.0" text-anchor="middle" class="td">相關嗎？</text><text x="860" y="265.0" text-anchor="middle" class="td-s">分數 ≥ 3.5 或命中小標題</text><text x="860" y="283.0" text-anchor="middle" class="td-s">且覆蓋率 ≥ 30%</text><rect x="1050.0" y="212.0" width="270" height="96" rx="14" class="err" filter="url(#sh)"/><text x="1185" y="245.0" text-anchor="middle" class="te">回答「找不到相關內容」</text><text x="1185" y="265.0" text-anchor="middle" class="te-s">提供「回報給管理員」按鈕</text><text x="1185" y="285.0" text-anchor="middle" class="te-s">記錄到管理頁「答不出來的問題」</text><path d="M215,260 L250,260" class="edge" marker-end="url(#arr)"/><path d="M460,260 L495,260" class="edge" marker-end="url(#arr)"/><path d="M715,260 L755,260" class="edge" marker-end="url(#arr)"/><path d="M965,260 L1050,260" class="edge" marker-end="url(#arr)"/><rect x="990.0" y="236" width="30" height="23" rx="11.5" class="pill no"/><text x="1005" y="252" text-anchor="middle" class="lbl no">否</text><rect x="310.0" y="340.0" width="500" height="44" rx="14" class="crisis" filter="url(#sh)"/><text x="560" y="367.0" text-anchor="middle" class="tc">提到想傷害自己：一定放入求助段落＋1925 專線卡片</text><path d="M130,298 L130,362 L310,362" class="edge dash" marker-end="url(#arr)"/><rect x="735.0" y="525.0" width="250" height="110" rx="14" class="proc" filter="url(#sh)"/><text x="860" y="555.0" text-anchor="middle" class="t">組合提示詞</text><text x="860" y="575.0" text-anchor="middle" class="t-s">系統規則：只根據資料回答、</text><text x="860" y="595.0" text-anchor="middle" class="t-s">繁體中文、不提供醫療診斷</text><text x="860" y="615.0" text-anchor="middle" class="t-s">＋ 前 1～3 段參考資料 ＋ 問題</text><circle cx="735.0" cy="525.0" r="14" class="num"/><text x="735.0" y="530.0" text-anchor="middle" class="num-t">4</text><path d="M860,325 L860,525" class="edge" marker-end="url(#arr)"/><rect x="866" y="409" width="30" height="23" rx="11.5" class="pill yes"/><text x="874" y="425" text-anchor="start" class="lbl yes">是</text><rect x="415.0" y="532.0" width="230" height="96" rx="14" class="ai" filter="url(#sh)"/><text x="530" y="565.0" text-anchor="middle" class="t">本機 Ollama</text><text x="530" y="585.0" text-anchor="middle" class="t-s">POST /api/chat</text><text x="530" y="605.0" text-anchor="middle" class="t-s">模型 gemma4:e2b</text><circle cx="415.0" cy="532.0" r="14" class="num"/><text x="415.0" y="537.0" text-anchor="middle" class="num-t">5</text><path d="M735,580 L645,580" class="edge" marker-end="url(#arr)"/><path d="M260,525.0 L345.0,580 L260,635.0 L175.0,580 Z" class="dec" filter="url(#sh)"/><text x="260" y="585.0" text-anchor="middle" class="td">成功？</text><path d="M415,580 L345,580" class="edge" marker-end="url(#arr)"/><rect x="60.0" y="707.0" width="230" height="96" rx="14" class="ok" filter="url(#sh)"/><text x="175" y="740.0" text-anchor="middle" class="t">🤖 AI 整理的回答</text><text x="175" y="760.0" text-anchor="middle" class="t-s">＋ 可展開的參考段落</text><text x="175" y="780.0" text-anchor="middle" class="t-s">（Markdown 轉成安全 HTML）</text><circle cx="60.0" cy="707.0" r="14" class="num"/><text x="60.0" y="712.0" text-anchor="middle" class="num-t">6</text><rect x="335.0" y="707.0" width="260" height="96" rx="14" class="err" filter="url(#sh)"/><text x="465" y="740.0" text-anchor="middle" class="te">📄 退回檢索模式</text><text x="465" y="760.0" text-anchor="middle" class="te-s">直接顯示最相關的段落</text><text x="465" y="780.0" text-anchor="middle" class="te-s">顯示原因（連不到／找不到模型）</text><path d="M260,635 L260,675 L175,675 L175,707" class="edge" marker-end="url(#arr)"/><rect x="183.0" y="652" width="44" height="23" rx="11.5" class="pill yes"/><text x="205" y="668" text-anchor="middle" class="lbl yes">成功</text><path d="M260,635 L260,675 L465,675 L465,707" class="edge" marker-end="url(#arr)"/><rect x="348.0" y="652" width="44" height="23" rx="11.5" class="pill no"/><text x="370" y="668" text-anchor="middle" class="lbl no">失敗</text><rect x="700" y="850" width="710" height="130" rx="18" class="zone"/><text x="720" y="880" class="zt">沒解決？</text><text x="720" y="902" class="zs"></text><rect x="730.0" y="892.0" width="200" height="60" rx="14" class="proc" filter="url(#sh)"/><text x="830" y="917.0" text-anchor="middle" class="t">問題回報</text><text x="830" y="937.0" text-anchor="middle" class="t-s">（Feedback 資料表）</text><rect x="970.0" y="892.0" width="180" height="60" rx="14" class="proc" filter="url(#sh)"/><text x="1060" y="917.0" text-anchor="middle" class="t">管理員更新狀態</text><text x="1060" y="937.0" text-anchor="middle" class="t-s">並回覆</text><rect x="1200.0" y="892.0" width="180" height="60" rx="14" class="proc" filter="url(#sh)"/><text x="1290" y="917.0" text-anchor="middle" class="t">使用者在</text><text x="1290" y="937.0" text-anchor="middle" class="t-s">「我的回報」看到回覆</text><path d="M930,922 L970,922" class="edge" marker-end="url(#arr)"/><path d="M1150,922 L1200,922" class="edge" marker-end="url(#arr)"/><text x="1395" y="810" text-anchor="end" class="note">知識庫只有說明文件，不包含任何人的心情紀錄；雲端部署（PythonAnywhere）沒有 Ollama 時自動使用退回模式</text>
</svg>