<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 858" width="1340" height="858"
     font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC','WenQuanYi Zen Hei',sans-serif">
  <defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6d28d9" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #312e81; }
      .sub { font-size: 15px; fill: #64748b; }
      .tbl { fill: #ffffff; stroke: #ddd6fe; stroke-width: 1.5; filter: url(#sh); }
      .tbl-head { fill: #7c3aed; }
      .t-name { font-family: Consolas, 'Courier New', monospace; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .t-label { font-size: 14px; fill: #ede9fe; }
      .zebra { fill: #faf5ff; }
      .rule { stroke: #f1f5f9; stroke-width: 1; }
      .col { font-family: Consolas, 'Courier New', monospace; font-size: 14.5px; fill: #1e293b; }
      .typ { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #6d28d9; }
      .desc { font-size: 13.5px; fill: #475569; }
      .badge-pk { fill: #f59e0b; } .badge-fk { fill: #2563eb; } .badge-uq { fill: #10b981; }
      .badge-t { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .rel { stroke: #64748b; stroke-width: 2; fill: none; stroke-linejoin: round; }
      .rel-o { stroke: #64748b; stroke-width: 2; fill: #ffffff; }
      .rel-box { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.2; }
      .rel-t { font-size: 16px; font-weight: 700; fill: #5b21b6; }
      .rel-s { font-size: 12px; fill: #6b7280; }
      .card { font-size: 16px; font-weight: 700; fill: #374151; }
      .zone { fill: #fbfaff; stroke: #ede9fe; stroke-width: 1.5; }
      .zone-h { font-size: 19px; font-weight: 700; fill: #4c1d95; }
      .n-k { font-size: 14px; font-weight: 700; fill: #6d28d9; }
      .n-v { font-size: 14px; fill: #475569; }
    </style>
  </defs>
  <rect width="1340" height="858" fill="#ffffff"/>
  <text x="40" y="52" class="title">MoodTrack 資料庫 ER 圖</text>
  <text x="40" y="78" class="sub">SQLite（moodtrack.db）・ 由 Flask-SQLAlchemy 模型 User、MoodRecord 建立</text>
  <text x="40" y="104" class="sub">欄位資訊依 app.py 實際定義繪製</text>
<g>
<rect x="40" y="140" width="540" height="234" rx="12" class="tbl"/>
<path d="M40,152 a12,12 0 0 1 12,-12 h516 a12,12 0 0 1 12,12 v42 h-540 z" class="tbl-head"/>
<text x="58" y="174" class="t-name">users</text>
<text x="562" y="174" text-anchor="end" class="t-label">使用者（User）</text>
<rect x="52" y="202" width="34" height="20" rx="5" class="badge-pk"/>
<text x="69" y="216" text-anchor="middle" class="badge-t">PK</text>
<text x="96" y="217.0" class="col" font-weight="700">id</text>
<text x="226" y="217.0" class="typ">INTEGER</text>
<text x="352" y="217.0" class="desc">主鍵，自動編號</text>
<rect x="41" y="230" width="538" height="36" class="zebra"/>
<line x1="40" y1="230" x2="580" y2="230" class="rule"/>
<rect x="52" y="238" width="34" height="20" rx="5" class="badge-uq"/>
<text x="69" y="252" text-anchor="middle" class="badge-t">UQ</text>
<text x="96" y="253.0" class="col">username</text>
<text x="226" y="253.0" class="typ">VARCHAR(80)</text>
<text x="352" y="253.0" class="desc">使用者名稱，唯一、必填</text>
<line x1="40" y1="266" x2="580" y2="266" class="rule"/>
<rect x="52" y="274" width="34" height="20" rx="5" class="badge-uq"/>
<text x="69" y="288" text-anchor="middle" class="badge-t">UQ</text>
<text x="96" y="289.0" class="col">email</text>
<text x="226" y="289.0" class="typ">VARCHAR(120)</text>
<text x="352" y="289.0" class="desc">電子郵件，唯一、必填（存小寫）</text>
<rect x="41" y="302" width="538" height="36" class="zebra"/>
<line x1="40" y1="302" x2="580" y2="302" class="rule"/>
<text x="96" y="325.0" class="col">password_hash</text>
<text x="226" y="325.0" class="typ">VARCHAR(255)</text>
<text x="352" y="325.0" class="desc">密碼雜湊（scrypt），必填</text>
<line x1="40" y1="338" x2="580" y2="338" class="rule"/>
<text x="96" y="361.0" class="col">created_at</text>
<text x="226" y="361.0" class="typ">DATETIME</text>
<text x="352" y="361.0" class="desc">帳號建立時間</text>
</g>
<g>
<rect x="700" y="140" width="600" height="378" rx="12" class="tbl"/>
<path d="M700,152 a12,12 0 0 1 12,-12 h576 a12,12 0 0 1 12,12 v42 h-600 z" class="tbl-head"/>
<text x="718" y="174" class="t-name">mood_records</text>
<text x="1282" y="174" text-anchor="end" class="t-label">情緒紀錄（MoodRecord）</text>
<rect x="712" y="202" width="34" height="20" rx="5" class="badge-pk"/>
<text x="729" y="216" text-anchor="middle" class="badge-t">PK</text>
<text x="756" y="217.0" class="col" font-weight="700">id</text>
<text x="936" y="217.0" class="typ">INTEGER</text>
<text x="1036" y="217.0" class="desc">主鍵，自動編號</text>
<rect x="701" y="230" width="598" height="36" class="zebra"/>
<line x1="700" y1="230" x2="1300" y2="230" class="rule"/>
<text x="756" y="253.0" class="col">record_date</text>
<text x="936" y="253.0" class="typ">DATE</text>
<text x="1036" y="253.0" class="desc">紀錄日期，必填</text>
<line x1="700" y1="266" x2="1300" y2="266" class="rule"/>
<text x="756" y="289.0" class="col">mood_score</text>
<text x="936" y="289.0" class="typ">INTEGER</text>
<text x="1036" y="289.0" class="desc">心情分數 1～10＊，必填</text>
<rect x="701" y="302" width="598" height="36" class="zebra"/>
<line x1="700" y1="302" x2="1300" y2="302" class="rule"/>
<text x="756" y="325.0" class="col">stress_score</text>
<text x="936" y="325.0" class="typ">INTEGER</text>
<text x="1036" y="325.0" class="desc">壓力分數 1～10＊，必填</text>
<line x1="700" y1="338" x2="1300" y2="338" class="rule"/>
<text x="756" y="361.0" class="col">sleep_hours</text>
<text x="936" y="361.0" class="typ">FLOAT</text>
<text x="1036" y="361.0" class="desc">睡眠時間 0～24 小時＊，必填</text>
<rect x="701" y="374" width="598" height="36" class="zebra"/>
<line x1="700" y1="374" x2="1300" y2="374" class="rule"/>
<text x="756" y="397.0" class="col">exercise_minutes</text>
<text x="936" y="397.0" class="typ">INTEGER</text>
<text x="1036" y="397.0" class="desc">運動時間 0～1440 分鐘＊，必填</text>
<line x1="700" y1="410" x2="1300" y2="410" class="rule"/>
<text x="756" y="433.0" class="col">note</text>
<text x="936" y="433.0" class="typ">TEXT</text>
<text x="1036" y="433.0" class="desc">今日備註，可留空</text>
<rect x="701" y="446" width="598" height="36" class="zebra"/>
<line x1="700" y1="446" x2="1300" y2="446" class="rule"/>
<text x="756" y="469.0" class="col">created_at</text>
<text x="936" y="469.0" class="typ">DATETIME</text>
<text x="1036" y="469.0" class="desc">紀錄建立時間</text>
<line x1="700" y1="482" x2="1300" y2="482" class="rule"/>
<rect x="712" y="490" width="34" height="20" rx="5" class="badge-fk"/>
<text x="729" y="504" text-anchor="middle" class="badge-t">FK</text>
<text x="756" y="505.0" class="col" font-weight="700">user_id</text>
<text x="936" y="505.0" class="typ">INTEGER</text>
<text x="1036" y="505.0" class="desc">外鍵 → users.id，必填</text>
</g>

<path d="M580,212.0 H640.0 V500.0 H700" class="rel"/>
<!-- users 端：恰好一個（||） -->
<line x1="592" y1="201.0" x2="592" y2="223.0" class="rel"/>
<line x1="600" y1="201.0" x2="600" y2="223.0" class="rel"/>
<!-- mood_records 端：零到多個（○ + 雞爪） -->
<line x1="684" y1="500.0" x2="700" y2="488.0" class="rel"/>
<line x1="684" y1="500.0" x2="700" y2="512.0" class="rel"/>
<circle cx="674" cy="500.0" r="7" class="rel-o"/>
<text x="610" y="200.0" class="card">1</text>
<text x="670" y="484.0" text-anchor="end" class="card">N</text>
<rect x="596.0" y="326.0" width="88" height="60" rx="10" class="rel-box"/>
<text x="640.0" y="350.0" text-anchor="middle" class="rel-t">擁有</text>
<text x="640.0" y="372.0" text-anchor="middle" class="rel-s">一對多</text>

<rect x="40" y="558" width="1260" height="230" rx="14" class="zone"/><text x="62" y="594" class="zone-h">設計說明</text><text x="62" y="630" class="n-k">關係</text><text x="160" y="630" class="n-v">一位使用者擁有 0～多筆情緒紀錄；每筆紀錄透過外鍵 user_id 只屬於一位使用者。</text><text x="62" y="664" class="n-k">唯一限制</text><text x="160" y="664" class="n-v">uq_user_record_date：(user_id, record_date) 不可重複，也就是每人每天只能有一筆紀錄。</text><text x="62" y="698" class="n-k">連帶刪除</text><text x="160" y="698" class="n-v">User.mood_records 設定 cascade="all, delete-orphan"，刪除使用者時一併刪除他的紀錄。</text><text x="62" y="732" class="n-k">資料驗證</text><text x="160" y="732" class="n-v">＊ 數值範圍由 Flask 後端驗證（資料庫層未設 CHECK 約束）；表單另有 min／max 做前端提示。</text><text x="62" y="766" class="n-k">資料安全</text><text x="160" y="766" class="n-v">密碼只存雜湊值；所有查詢都加上 user_id = 目前登入者，使用者只能存取自己的紀錄。</text>

<g>
  <rect x="40" y="807" width="34" height="20" rx="5" class="badge-pk"/><text x="57" y="821" text-anchor="middle" class="badge-t">PK</text>
  <text x="82" y="822" class="n-v">主鍵</text>
  <rect x="140" y="807" width="34" height="20" rx="5" class="badge-fk"/><text x="157" y="821" text-anchor="middle" class="badge-t">FK</text>
  <text x="182" y="822" class="n-v">外鍵</text>
  <rect x="240" y="807" width="34" height="20" rx="5" class="badge-uq"/><text x="257" y="821" text-anchor="middle" class="badge-t">UQ</text>
  <text x="282" y="822" class="n-v">唯一值</text>
  <line x1="360" y1="817" x2="400" y2="817" class="rel"/>
  <line x1="372" y1="807" x2="372" y2="827" class="rel"/><line x1="380" y1="807" x2="380" y2="827" class="rel"/>
  <text x="410" y="822" class="n-v">恰好一個</text>
  <line x1="500" y1="817" x2="550" y2="817" class="rel"/>
  <circle cx="524" cy="817" r="6" class="rel-o"/>
  <line x1="534" y1="817" x2="550" y2="807" class="rel"/><line x1="534" y1="817" x2="550" y2="827" class="rel"/>
  <text x="560" y="822" class="n-v">零到多個</text>
</g>
</svg>
