<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1278" width="1340" height="1278"
     font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC','WenQuanYi Zen Hei',sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6d28d9" flood-opacity="0.08"/></filter>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #312e81; } .sub { font-size: 15px; fill: #64748b; }
      .tbl { fill: #fff; stroke: #ddd6fe; stroke-width: 1.5; filter: url(#sh); } .tbl-head { fill: #7c3aed; }
      .t-name { font-family: Consolas, 'Courier New', monospace; font-size: 20px; font-weight: 700; fill: #fff; }
      .t-label { font-size: 14px; fill: #ede9fe; } .zebra { fill: #faf5ff; } .rule { stroke: #f1f5f9; }
      .col { font-family: Consolas, 'Courier New', monospace; font-size: 14.5px; fill: #1e293b; }
      .typ { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #6d28d9; }
      .desc { font-size: 13.5px; fill: #475569; }
      .badge-pk { fill: #f59e0b; } .badge-fk { fill: #2563eb; } .badge-uq { fill: #10b981; }
      .badge-t { font-family: Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #fff; }
      .rel { stroke: #64748b; stroke-width: 2; fill: none; stroke-linejoin: round; } .rel-o { stroke: #64748b; stroke-width: 2; fill: #fff; }
      .rel-box { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.2; } .rel-t { font-size: 16px; font-weight: 700; fill: #5b21b6; }
      .rel-s { font-size: 12.5px; fill: #64748b; }
      .zone { fill: #fbfaff; stroke: #ede9fe; stroke-width: 1.5; } .zone-h { font-size: 19px; font-weight: 700; fill: #4c1d95; }
      .n-k { font-size: 14px; font-weight: 700; fill: #6d28d9; } .n-v { font-size: 14px; fill: #475569; }
    </style>
  </defs>
  <rect width="1340" height="1278" fill="#fff"/>
  <text x="40" y="56" class="title">MoodTrack 資料庫 ER 圖</text>
  <text x="40" y="84" class="sub">SQLite（moodtrack.db）・ 4 張資料表，由 Flask-SQLAlchemy 模型建立，欄位依 app.py 實際定義繪製</text>
  <rect x="40" y="140" width="560" height="234" rx="12" class="tbl"/><path d="M40,152 a12,12 0 0 1 12,-12 h536 a12,12 0 0 1 12,12 v42 h-560 z" class="tbl-head"/><text x="58" y="174" class="t-name">users</text><text x="582" y="174" text-anchor="end" class="t-label">使用者（User）</text><rect x="52" y="202" width="34" height="20" rx="5" class="badge-pk"/><text x="69" y="216" text-anchor="middle" class="badge-t">PK</text><text x="96" y="217.0" class="col" font-weight="700">id</text><text x="240" y="217.0" class="typ">INTEGER</text><text x="376" y="217.0" class="desc">主鍵，自動編號</text><rect x="41" y="230" width="558" height="36" class="zebra"/><line x1="40" y1="230" x2="600" y2="230" class="rule"/><rect x="52" y="238" width="34" height="20" rx="5" class="badge-uq"/><text x="69" y="252" text-anchor="middle" class="badge-t">UQ</text><text x="96" y="253.0" class="col">username</text><text x="240" y="253.0" class="typ">VARCHAR(80)</text><text x="376" y="253.0" class="desc">使用者名稱，唯一、必填</text><line x1="40" y1="266" x2="600" y2="266" class="rule"/><rect x="52" y="274" width="34" height="20" rx="5" class="badge-uq"/><text x="69" y="288" text-anchor="middle" class="badge-t">UQ</text><text x="96" y="289.0" class="col">email</text><text x="240" y="289.0" class="typ">VARCHAR(120)</text><text x="376" y="289.0" class="desc">電子郵件，唯一、必填（存小寫）</text><rect x="41" y="302" width="558" height="36" class="zebra"/><line x1="40" y1="302" x2="600" y2="302" class="rule"/><text x="96" y="325.0" class="col">password_hash</text><text x="240" y="325.0" class="typ">VARCHAR(255)</text><text x="376" y="325.0" class="desc">密碼雜湊（scrypt），必填</text><line x1="40" y1="338" x2="600" y2="338" class="rule"/><text x="96" y="361.0" class="col">created_at</text><text x="240" y="361.0" class="typ">DATETIME</text><text x="376" y="361.0" class="desc">帳號建立時間</text><rect x="40" y="560" width="560" height="234" rx="12" class="tbl"/><path d="M40,572 a12,12 0 0 1 12,-12 h536 a12,12 0 0 1 12,12 v42 h-560 z" class="tbl-head"/><text x="58" y="594" class="t-name">help_questions</text><text x="582" y="594" text-anchor="end" class="t-label">小幫手提問（HelpQuestion）</text><rect x="52" y="622" width="34" height="20" rx="5" class="badge-pk"/><text x="69" y="636" text-anchor="middle" class="badge-t">PK</text><text x="96" y="637.0" class="col" font-weight="700">id</text><text x="240" y="637.0" class="typ">INTEGER</text><text x="376" y="637.0" class="desc">主鍵，自動編號</text><rect x="41" y="650" width="558" height="36" class="zebra"/><line x1="40" y1="650" x2="600" y2="650" class="rule"/><rect x="52" y="658" width="34" height="20" rx="5" class="badge-fk"/><text x="69" y="672" text-anchor="middle" class="badge-t">FK</text><text x="96" y="673.0" class="col" font-weight="700">user_id</text><text x="240" y="673.0" class="typ">INTEGER</text><text x="376" y="673.0" class="desc">外鍵 → users.id</text><line x1="40" y1="686" x2="600" y2="686" class="rule"/><text x="96" y="709.0" class="col">question</text><text x="240" y="709.0" class="typ">VARCHAR(300)</text><text x="376" y="709.0" class="desc">提問內容</text><rect x="41" y="722" width="558" height="36" class="zebra"/><line x1="40" y1="722" x2="600" y2="722" class="rule"/><text x="96" y="745.0" class="col">mode</text><text x="240" y="745.0" class="typ">VARCHAR(20)</text><text x="376" y="745.0" class="desc">llm／retrieval／none</text><line x1="40" y1="758" x2="600" y2="758" class="rule"/><text x="96" y="781.0" class="col">created_at</text><text x="240" y="781.0" class="typ">DATETIME</text><text x="376" y="781.0" class="desc">提問時間</text><rect x="720" y="140" width="580" height="378" rx="12" class="tbl"/><path d="M720,152 a12,12 0 0 1 12,-12 h556 a12,12 0 0 1 12,12 v42 h-580 z" class="tbl-head"/><text x="738" y="174" class="t-name">mood_records</text><text x="1282" y="174" text-anchor="end" class="t-label">情緒紀錄（MoodRecord）</text><rect x="732" y="202" width="34" height="20" rx="5" class="badge-pk"/><text x="749" y="216" text-anchor="middle" class="badge-t">PK</text><text x="776" y="217.0" class="col" font-weight="700">id</text><text x="946" y="217.0" class="typ">INTEGER</text><text x="1064" y="217.0" class="desc">主鍵，自動編號</text><rect x="721" y="230" width="578" height="36" class="zebra"/><line x1="720" y1="230" x2="1300" y2="230" class="rule"/><text x="776" y="253.0" class="col">record_date</text><text x="946" y="253.0" class="typ">DATE</text><text x="1064" y="253.0" class="desc">紀錄日期，必填</text><line x1="720" y1="266" x2="1300" y2="266" class="rule"/><text x="776" y="289.0" class="col">mood_score</text><text x="946" y="289.0" class="typ">INTEGER</text><text x="1064" y="289.0" class="desc">心情分數 1～10＊</text><rect x="721" y="302" width="578" height="36" class="zebra"/><line x1="720" y1="302" x2="1300" y2="302" class="rule"/><text x="776" y="325.0" class="col">stress_score</text><text x="946" y="325.0" class="typ">INTEGER</text><text x="1064" y="325.0" class="desc">壓力分數 1～10＊</text><line x1="720" y1="338" x2="1300" y2="338" class="rule"/><text x="776" y="361.0" class="col">sleep_hours</text><text x="946" y="361.0" class="typ">FLOAT</text><text x="1064" y="361.0" class="desc">睡眠時間 0～24 小時＊</text><rect x="721" y="374" width="578" height="36" class="zebra"/><line x1="720" y1="374" x2="1300" y2="374" class="rule"/><text x="776" y="397.0" class="col">exercise_minutes</text><text x="946" y="397.0" class="typ">INTEGER</text><text x="1064" y="397.0" class="desc">運動時間 0～1440 分鐘＊</text><line x1="720" y1="410" x2="1300" y2="410" class="rule"/><text x="776" y="433.0" class="col">note</text><text x="946" y="433.0" class="typ">TEXT</text><text x="1064" y="433.0" class="desc">今日備註，可留空</text><rect x="721" y="446" width="578" height="36" class="zebra"/><line x1="720" y1="446" x2="1300" y2="446" class="rule"/><text x="776" y="469.0" class="col">created_at</text><text x="946" y="469.0" class="typ">DATETIME</text><text x="1064" y="469.0" class="desc">紀錄建立時間</text><line x1="720" y1="482" x2="1300" y2="482" class="rule"/><rect x="732" y="490" width="34" height="20" rx="5" class="badge-fk"/><text x="749" y="504" text-anchor="middle" class="badge-t">FK</text><text x="776" y="505.0" class="col" font-weight="700">user_id</text><text x="946" y="505.0" class="typ">INTEGER</text><text x="1064" y="505.0" class="desc">外鍵 → users.id</text><rect x="720" y="560" width="580" height="378" rx="12" class="tbl"/><path d="M720,572 a12,12 0 0 1 12,-12 h556 a12,12 0 0 1 12,12 v42 h-580 z" class="tbl-head"/><text x="738" y="594" class="t-name">feedback</text><text x="1282" y="594" text-anchor="end" class="t-label">問題回報（Feedback）</text><rect x="732" y="622" width="34" height="20" rx="5" class="badge-pk"/><text x="749" y="636" text-anchor="middle" class="badge-t">PK</text><text x="776" y="637.0" class="col" font-weight="700">id</text><text x="946" y="637.0" class="typ">INTEGER</text><text x="1064" y="637.0" class="desc">主鍵，自動編號</text><rect x="721" y="650" width="578" height="36" class="zebra"/><line x1="720" y1="650" x2="1300" y2="650" class="rule"/><rect x="732" y="658" width="34" height="20" rx="5" class="badge-fk"/><text x="749" y="672" text-anchor="middle" class="badge-t">FK</text><text x="776" y="673.0" class="col" font-weight="700">user_id</text><text x="946" y="673.0" class="typ">INTEGER</text><text x="1064" y="673.0" class="desc">外鍵 → users.id</text><line x1="720" y1="686" x2="1300" y2="686" class="rule"/><text x="776" y="709.0" class="col">category</text><text x="946" y="709.0" class="typ">VARCHAR(20)</text><text x="1064" y="709.0" class="desc">類型：錯誤／帳號／建議…</text><rect x="721" y="722" width="578" height="36" class="zebra"/><line x1="720" y1="722" x2="1300" y2="722" class="rule"/><text x="776" y="745.0" class="col">title</text><text x="946" y="745.0" class="typ">VARCHAR(100)</text><text x="1064" y="745.0" class="desc">標題</text><line x1="720" y1="758" x2="1300" y2="758" class="rule"/><text x="776" y="781.0" class="col">content</text><text x="946" y="781.0" class="typ">TEXT</text><text x="1064" y="781.0" class="desc">回報內容</text><rect x="721" y="794" width="578" height="36" class="zebra"/><line x1="720" y1="794" x2="1300" y2="794" class="rule"/><text x="776" y="817.0" class="col">status</text><text x="946" y="817.0" class="typ">VARCHAR(20)</text><text x="1064" y="817.0" class="desc">待處理／處理中／已解決</text><line x1="720" y1="830" x2="1300" y2="830" class="rule"/><text x="776" y="853.0" class="col">admin_reply</text><text x="946" y="853.0" class="typ">TEXT</text><text x="1064" y="853.0" class="desc">管理員回覆，可留空</text><rect x="721" y="866" width="578" height="36" class="zebra"/><line x1="720" y1="866" x2="1300" y2="866" class="rule"/><text x="776" y="889.0" class="col">created_at</text><text x="946" y="889.0" class="typ">DATETIME</text><text x="1064" y="889.0" class="desc">建立時間</text><line x1="720" y1="902" x2="1300" y2="902" class="rule"/><text x="776" y="925.0" class="col">updated_at</text><text x="946" y="925.0" class="typ">DATETIME</text><text x="1064" y="925.0" class="desc">最後更新時間</text><path d="M600,212.0 H660 V500.0 H720" class="rel"/><line x1="612" y1="202.0" x2="612" y2="222.0" class="rel"/><line x1="619" y1="202.0" x2="619" y2="222.0" class="rel"/><line x1="704" y1="500.0" x2="720" y2="489.0" class="rel"/><line x1="704" y1="500.0" x2="720" y2="511.0" class="rel"/><circle cx="694" cy="500.0" r="7" class="rel-o"/><path d="M660,500.0 V668.0 H720" class="rel"/><line x1="704" y1="668.0" x2="720" y2="657.0" class="rel"/><line x1="704" y1="668.0" x2="720" y2="679.0" class="rel"/><circle cx="694" cy="668.0" r="7" class="rel-o"/><path d="M364,374 V560" class="rel"/><line x1="354" y1="386" x2="374" y2="386" class="rel"/><line x1="354" y1="393" x2="374" y2="393" class="rel"/><line x1="364" y1="544" x2="353" y2="560" class="rel"/><line x1="364" y1="544" x2="375" y2="560" class="rel"/><circle cx="364" cy="534" r="7" class="rel-o"/><rect x="616" y="330.0" width="88" height="52" rx="10" class="rel-box"/><text x="660" y="353.0" text-anchor="middle" class="rel-t">擁有</text><text x="660" y="373.0" text-anchor="middle" class="rel-s">一對多</text><text x="380" y="472.0" class="rel-s">一對多（提問）</text><text x="670" y="546" class="rel-s">一對多（回報）</text><rect x="40" y="978" width="1260" height="230" rx="14" class="zone"/><text x="62" y="1014" class="zone-h">設計說明</text><text x="62" y="1050" class="n-k">關係</text><text x="160" y="1050" class="n-v">一位使用者可擁有 0～多筆情緒紀錄、問題回報與小幫手提問；每筆都透過外鍵 user_id 只屬於一位使用者。</text><text x="62" y="1084" class="n-k">唯一限制</text><text x="160" y="1084" class="n-v">uq_user_record_date：(user_id, record_date) 不可重複，每人每天只能有一筆情緒紀錄。</text><text x="62" y="1118" class="n-k">連帶刪除</text><text x="160" y="1118" class="n-v">三個關聯都設定 cascade="all, delete-orphan"，刪除使用者時一併刪除他的所有資料。</text><text x="62" y="1152" class="n-k">資料驗證</text><text x="160" y="1152" class="n-v">＊ 數值範圍由 Flask 後端驗證（資料庫層未設 CHECK 約束）。</text><text x="62" y="1186" class="n-k">隱私</text><text x="160" y="1186" class="n-v">管理員身分由環境變數 ADMIN_EMAILS 決定，不存在資料表；管理頁只讀取彙總數字，不讀取 note 等心情內容。</text><rect x="40" y="1227" width="34" height="20" rx="5" class="badge-pk"/><text x="57" y="1241" text-anchor="middle" class="badge-t">PK</text><text x="82" y="1242" class="n-v">主鍵</text>
<rect x="140" y="1227" width="34" height="20" rx="5" class="badge-fk"/><text x="157" y="1241" text-anchor="middle" class="badge-t">FK</text><text x="182" y="1242" class="n-v">外鍵</text>
<rect x="240" y="1227" width="34" height="20" rx="5" class="badge-uq"/><text x="257" y="1241" text-anchor="middle" class="badge-t">UQ</text><text x="282" y="1242" class="n-v">唯一值</text>
<line x1="360" y1="1237" x2="400" y2="1237" class="rel"/><line x1="372" y1="1227" x2="372" y2="1247" class="rel"/><line x1="380" y1="1227" x2="380" y2="1247" class="rel"/><text x="410" y="1242" class="n-v">恰好一個</text>
<line x1="500" y1="1237" x2="550" y2="1237" class="rel"/><circle cx="524" cy="1237" r="6" class="rel-o"/><line x1="534" y1="1237" x2="550" y2="1227" class="rel"/><line x1="534" y1="1237" x2="550" y2="1247" class="rel"/><text x="560" y="1242" class="n-v">零到多個</text>
</svg>